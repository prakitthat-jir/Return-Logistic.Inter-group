<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt','Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 45%,#2563eb 100%);color:#0f172a}
.card{background:#fff;border-radius:20px;padding:40px 36px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.32)}
.card[hidden]{display:none}
.logo{height:60px}
.rule{width:54px;height:4px;border-radius:3px;background:linear-gradient(90deg,#2563eb,#ff6a13);margin:14px auto 18px}
h1{font-size:1.45rem;font-weight:800;color:#1e40af}
.sub{font-size:.8rem;color:#64748b;margin-top:6px;font-weight:600}
form{margin-top:22px;text-align:left}
label{font-size:.82rem;font-weight:600;color:#334155}
input[type=password]{width:100%;margin-top:6px;padding:12px 14px;border:1px solid #cbd5e1;border-radius:11px;font:inherit;font-size:1rem}
input[type=password]:focus{outline:2px solid #2563eb;border-color:#2563eb}
.rem{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;color:#475569;cursor:pointer}
button{margin-top:18px;width:100%;padding:13px;border:none;border-radius:12px;font:inherit;font-size:1rem;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#3b82f6,#1e40af);cursor:pointer;box-shadow:0 8px 20px rgba(37,99,235,.35)}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.3em;margin-top:10px;font-size:.82rem;color:#dc2626;text-align:center}
.foot{margin-top:12px;font-size:.66rem;color:#94a3b8}
</style>
</head>

<div class="card" id="gate" hidden>
  <img class="logo" src="IFC%20Logo.png" alt="IFC" onerror="this.style.display='none'">

  <h1>ระบบรับคืนสินค้า</h1>
  <div class="sub">ฝ่ายจัดส่งและคลังสินค้า · บริษัท อินเตอร์ไฟเบอร์ คอนเทนเนอร์ จำกัด</div>
  <form id="f">
    <label for="pw">รหัสผ่าน</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="rem"><input type="checkbox" id="rem" checked> จำในเครื่องนี้</label>
    <button id="go" type="submit">เข้าสู่ระบบ</button>
    <div class="err" id="err"></div>
  </form>

<script>
/* หน้ารหัสผ่าน: เนื้อหาแอป + ข้อมูลทั้งหมดถูกเข้ารหัส (PBKDF2-SHA256 → AES-256-CBC + HMAC-SHA256) สร้างโดย tools/publish.ps1 */
(function(){
  'use strict';
  var KEY='ifc_gate_key_v1';
  var P=JSON.parse(document.getElementById('payload').textContent);
  var $=function(id){return document.getElementById(id);};
  function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function b64e(u){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
  async function derive(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(P.salt),iterations:P.iter},base,512));
  }
  async function unlock(bits){   // คืน HTML ของแอป หรือ null ถ้ารหัสผิด
    var iv=b64d(P.iv),ct=b64d(P.ct),mac=b64d(P.mac);
    var data=new Uint8Array(iv.length+ct.length); data.set(iv); data.set(ct,iv.length);
    var mk=await crypto.subtle.importKey('raw',bits.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
    if(!(await crypto.subtle.verify('HMAC',mk,mac,data))) return null;
    var ek=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ek,ct));
  }
  function show(html){
    // ต้องรอหน้านี้โหลดเสร็จสมบูรณ์ (load + พ้น event) ก่อนแทนที่ด้วยแอป
    // ถ้าแทนที่ระหว่างโหลด เบราว์เซอร์จะตัดการอ่าน HTML ของแอปทิ้งที่สคริปต์ CDN ตัวแรก (หน้าว่าง/layout พัง)
    var go=function(){ document.open(); document.write(html); document.close(); };
    if(document.readyState==='complete') setTimeout(go,0);
    else window.addEventListener('load',function(){ setTimeout(go,0); },{once:true});
  }
  function gate(msg){ $('gate').hidden=false; $('err').textContent=msg||''; $('pw').focus(); }
  async function boot(){
    if(!window.crypto||!crypto.subtle){ gate('เบราว์เซอร์นี้ไม่รองรับ — เปิดผ่านลิงก์ https ด้วย Chrome หรือ Edge'); return; }
    var saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    if(saved && saved.s===P.salt && saved.i===P.iter){
      try{ var html=await unlock(b64d(saved.k)); if(html){ show(html); return; } }catch(e){}
      try{ localStorage.removeItem(KEY); }catch(e){}
    }
    gate();
  }
  $('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var pw=$('pw').value; if(!pw) return;
    $('go').disabled=true; $('err').textContent='กำลังเปิด…';
    try{
      var bits=await derive(pw), html=await unlock(bits);
      if(!html){ $('go').disabled=false; gate('รหัสผ่านไม่ถูกต้อง'); $('pw').select(); return; }
      if($('rem').checked){ try{ localStorage.setItem(KEY,JSON.stringify({s:P.salt,i:P.iter,k:b64e(bits)})); }catch(e){} }
      show(html);
    }catch(err){ $('go').disabled=false; gate('เปิดไม่สำเร็จ: '+((err&&err.message)||err)); }
  });
  boot();
})();
</script>
